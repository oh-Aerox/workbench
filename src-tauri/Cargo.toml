[package]
name = "agent-workbench"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "agent_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
chrono = "0.4"

# 体积优化：这些开关把 release 产物压到最小
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
